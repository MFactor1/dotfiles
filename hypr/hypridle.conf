listener {
    timeout = 180                                 # 3min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 300                                                     # 5 min
    on-timeout = systemctl suspend                            # screen off when timeout has passed
	#on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'
    #on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'          # screen on when activity is detected after timeout has fired.
}

