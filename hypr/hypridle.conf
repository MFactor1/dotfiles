general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 60                                # 1min.
    on-timeout = ~/.config/scripts/ddcutil_dim.sh         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = ~/.config/scripts/ddcutil_restore.sh                 # monitor backlight restore.
}
